    input_schema:
      type: object
      properties:
        command: {type: string, description: A shell command to run against the virtualized documentation filesystem}
      required: [command]
  - name: submit_feedback
    description: >-
      Report a problem with this documentation site so the docs team can fix it.
    input_schema:
