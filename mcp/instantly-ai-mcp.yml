servers:
- name: instantly-mcp
  kind: product
  transport: http
  url: https://mcp.instantly.ai/
  legacy_paths:
  - /mcp
  - /mcp/{api_key}
  auth:
    type: oauth
    challenge: 'Bearer realm="instantly-mcp", resource_metadata="https://mcp.instantly.ai/.well-known/oauth-protected-resource"'
    authorization_servers:
    - https://api.instantly.ai
    dynamic_client_registration: https://api.instantly.ai/oauth/register
    alternative_headers:
    - x-instantly-api-key
    - x-as-workspace
    note: >-
      The CORS preflight advertises `x-instantly-api-key` and `x-as-workspace` as accepted
      request headers alongside `authorization`, so a workspace API key appears to be an
      accepted credential in addition to an OAuth bearer token. Not verified — doing so
      would require a live key.
  tools_list:
    probed: true
    http_status: 401
    gated: true
    note: >-
      tools/list returns 401 with an OAuth Protected Resource challenge on both `/` and the
      legacy `/mcp` path, so the live tool schemas require an authenticated introspection.
      No tool list is recorded here rather than guessing one; the REST operations this
      server fronts are enumerated in mcp/instantly-ai-tool-crosswalk.yml.
