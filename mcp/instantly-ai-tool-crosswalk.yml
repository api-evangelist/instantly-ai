note: Instantly runs two remote MCP servers. The product server (mcp.instantly.ai) gates tools/list behind
  OAuth, so its tool names are NOT known and NOTHING is mapped for it — no tool is invented to fill the
  gap. The documentation server (developer.instantly.ai/mcp) answers anonymously and its three tools are
  real, but none of them wraps a REST operation, so they are all mcp_only. Every REST operation therefore
  lands in rest_only until the product server can be introspected with a key.
