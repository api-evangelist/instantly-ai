aid: instantly-ai
url: https://raw.githubusercontent.com/api-evangelist/instantly-ai/refs/heads/main/apis.yml
name: Instantly
kind: company
description: Instantly is a cold email outbound platform that combines mailbox sending
  infrastructure, email warmup, a B2B lead database, deliverability tools, and a unified
  inbox for replies. The Instantly v2 REST API at api.instantly.ai/api/v2 publishes a
  173-operation OpenAPI 3.1 covering campaigns and subsequences, leads and lead lists,
  sending accounts and warmup, email verification, inbox placement tests, SuperSearch
  enrichment, blocklists, custom tags, audit logs, background jobs, webhooks, analytics,
  API keys, workspaces and workspace groups. Authentication is a scoped Bearer API key
  backed by a full OAuth 2.0 authorization server with 178 published scopes, PKCE and
  dynamic client registration. Instantly also runs a hosted remote MCP server, publishes
  an A2A agent card, an llms.txt and first-party Agent Skills.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
  - pricing
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid plan required · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  - openapi
  generated: '2026-08-13'
  method: derived
  note: >-
    Corrected from "free" on 2026-08-13. Instantly publishes no free plan — the pricing page starts
    at $47/month — and API access is gated on a paid subscription: 170 of the 173 operations in the
    published OpenAPI document a 402 response meaning "the workspace does not have an active paid
    plan". Signup is self-serve, but an API key cannot be exercised without paying.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/instantly-ai.png
