versioning:
  scheme: uri-path
  current: v2
  path_prefix: /api/v2
  spec_version: 2.0.0
  docs: https://developer.instantly.ai/api-reference/introduction
  note: >-
    Version lives in the path. There is no version header, no date-pinning, and no per-version
    changelog. API v2 is a clean break from v1 — the introduction states the two are NOT compatible
    and a v2 key is required.
deprecation:
  policy_url: https://developer.instantly.ai/guides/api-v1-migration
  announced: true
  sunset_header: false
  deprecation_header: false
  detail: >-
    Instantly ran a real, dated deprecation: API v1 was deprecated on January 19, 2026, announced in
    the migration guide with a full v1-to-v2 endpoint mapping table covering campaigns, analytics,
    leads, accounts and unibox. Existing v1-based integrations (Zapier, Make and similar) were
    explicitly promised no disruption. What is missing is the machine-readable half — no RFC 8594
    Sunset or Deprecation response headers are documented or observed, and no operation in the
    173-operation v2 spec carries `deprecated: true`, so an agent cannot detect an impending removal
    from a response.
  events:
  - {version: v1, event: deprecated, date: '2026-01-19', source: 'https://developer.instantly.ai/guides/api-v1-migration'}
  legacy_docs: https://app.theneo.io/instantly-ai/instantlyapidocs/introduction
