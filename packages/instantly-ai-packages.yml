finding: >-
  The abandonment signal here is not staleness, it is absence from the registries. Instantly ships
  two genuinely first-party, spec-generated SDKs and a scaffolder, and publishes none of them, so
  `npm install @instantly-ai/sdk` and `pip install instantly` both fail for every developer who
  reads the docs. Publishing the three names is a small piece of work with an outsized effect on
  how reachable this API is.
