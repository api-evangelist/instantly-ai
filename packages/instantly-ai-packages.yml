note: >-
  Instantly's first-party SDKs are real and generated from the OpenAPI, but they are DISTRIBUTED BY
  CLONE, not by registry. The JS package @instantly-ai/sdk and the Python package `instantly` live in
  the Instantly-ai/instantly-starter-kit repository and are vendored into a project by the
  create-instantly-app scaffolder; none of the three names resolves on npm or PyPI (all 404 on
  2026-08-13). Their own README says so: "Not published yet — the kit is clone-based." The only
  first-party artifact that IS on a registry is the n8n community node. Versions and dates below are
  read from registry metadata where a registry exists, and from the repository otherwise.
