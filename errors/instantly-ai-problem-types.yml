format: custom-json
rfc9457: false
envelope:
  media_type: application/json
  schema:
    statusCode: number
    error: string
    message: string
  example:
    statusCode: 404
    error: Not Found
    message: Resource not found
  note: >-
    Instantly does not use application/problem+json. Every documented error response in the
    173-operation OpenAPI carries the same three-field JSON envelope, with statusCode and error
    pinned by enum to the specific status. The first-party SDKs surface it as InstantlyApiError
    with .status, .statusText and the parsed .payload.
coverage:
  operations: 173
  operations_documenting_401: 170
  operations_documenting_402: 170
