x-source: >-
  Derived from artifacts in this repo — well-known/instantly-ai-oauth-authorization-server.json,
  scopes/instantly-ai-scopes.yml, conventions/instantly-ai-conventions.yml,
  rate-limits/instantly-ai-rate-limits.yml, errors/instantly-ai-problem-types.yml and
