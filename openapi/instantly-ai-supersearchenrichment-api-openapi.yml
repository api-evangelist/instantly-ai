                    domains:
                      type: array
                      items:
                        type: string
                        description: Domains of the lead company to include in the search
                        example: google.com
                    website_visitors:
                      type: boolean
                      description: Restrict the search to companies that visited your website (requires a connected Website Visitors pixel). Combines with `domains` as an intersection.
                      example: true
                    funding_type:
                      type: array
                      items:
                        type: string
                        enum:
                        - angel
                        - seed
                        - pre_seed
                        - series_a
                        - pre_series_a
                        - series_b
                        - pre_series_b
                        - series_c
                        - pre_series_c
