                    example: true
                  enrichment_payload:
                    type: object
                    description: Enrichment types
                    minProperties: 1
                    properties:
                      work_email_enrichment:
                        type: boolean
                        example: true
                      fully_enriched_profile:
                        type: boolean
                        example: true
                      email_verification:
                        type: boolean
                        example: false
                      joblisting:
                        type: boolean
                        example: true
                      technologies:
                        type: boolean
                        example: true
                      news:
                        type: boolean
                        example: true
                      funding:
                        type: boolean
                        example: true
                      engagement_score:
