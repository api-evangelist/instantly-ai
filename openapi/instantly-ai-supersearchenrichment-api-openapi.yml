      tags:
      - SuperSearchEnrichment
      description: Get the enrichment for a specific resource
      parameters:
      - schema:
          format: uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        example: 123e4567-e89b-12d3-a456-426614174000
        in: path
