                        example: true
                      ai_enrichment:
                        type: object
                        additionalProperties: true
                      custom_flow:
                        type: array
                        items:
                          type: string
                          example: leadmagic
                        example:
                        - leadmagic
                        - prospeo
                        - hunter
                      limit:
