openapi: 3.2.0
info:
  title: Explorer Analytics API
  description: The entire API V2 documentation is interactive and can be tested here. To the right side of every endpoint you will see a box with an example request. You can click on the "Try it" button to send a request to the server right from the docs. You will need to provide an API key by clicking the `ApiKeyAuth_token` blue text.
  version: 2.0.0
servers:
- url: https://api.instantly.ai
  description: Instantly API Server
security:
- ApiKeyAuth: []
tags:
- name: Analytics
  description: Endpoints related to analytics
  x-group: Analytics
paths:
  /api/v2/accounts/warmup-analytics:
    post:
      operationId: getWarmupAnalytics
      summary: Get warmup analytics
      tags:
      - Analytics
      description: 'Requires one of the following scopes: `accounts:read`, `accounts:all`, `all:read`, `all:all`'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emails:
                  type: array
                  items:
                    type: string
                    example: user@example.com
                  maxItems: 100
                  minItems: 1
                  description: List of emails to get warmup analytics for. The emails should be attached to accounts in your workspace.
              required:
              - emails
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_date_data:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          sent:
                            type: number
                            example: 100
                          landed_inbox:
                            type: number
                            example: 50
                          landed_spam:
                            type: number
                            example: 10
                          received:
                            type: number
                            example: 100
                  aggregate_data:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        sent:
                          type: number
                          examples:
                          - 100
                          example: 100
                        received:
                          type: number
                          examples:
                          - 100
                          example: 100
                        landed_inbox:
                          type: number
                          examples:
                          - 50
                          example: 50
                        landed_spam:
                          type: number
                          examples:
                          - 10
                          example: 10
                        health_score_label:
                          type: string
                          examples:
                          - Good
                          example: Good
                        health_score:
                          type: number
                          examples:
                          - 90
                          example: 90
              example:
                email_date_data:
                  example1@example.com:
                    '2023-10-01':
                      sent: 10
                      landed_inbox: 8
                      landed_spam: 2
                      received: 10
                    '2023-10-02':
                      sent: 5
                      landed_inbox: 5
                      received: 5
                  example2@example.com:
                    '2023-10-01':
                      sent: 7
                      landed_inbox: 7
                      received: 7
                aggregate_data:
                  example1@example.com:
                    sent: 15
                    landed_inbox: 13
                    landed_spam: 2
                    received: 15
                    health_score_label: 87%
                    health_score: 87
                  example2@example.com:
                    sent: 7
                    landed_inbox: 7
                    health_score_label: 100%
                    health_score: 100
        '401':
          description: This request is unauthorized (either the Authorization header is missing or invalid, or the API key has been revoked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 401
                    examples:
                    - 401
                    example: 401
                  error:
                    type: string
                    enum:
                    - Unauthorized
                    examples:
                    - Unauthorized
                    example: Unauthorized
                  message:
                    type: string
                    examples:
                    - Missing Authorization header
                    example: Missing Authorization header
                required:
                - statusCode
                - error
                - message
        '402':
          description: This request cannot be fulfilled because the workspace does not have an active paid plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 402
                    examples:
                    - 402
                    example: 402
                  error:
                    type: string
                    enum:
                    - Payment Required
                    examples:
                    - Payment Required
                    example: Payment Required
                  message:
                    type: string
                    examples:
                    - Workspace does not have an active paid plan
                    example: Workspace does not have an active paid plan
                required:
                - statusCode
                - error
                - message
        '404':
          description: The requested resource was not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 404
                    examples:
                    - 404
                    example: 404
                  error:
                    type: string
                    enum:
                    - Not Found
                    examples:
                    - Not Found
                    example: Not Found
                  message:
                    type: string
                    examples:
                    - Resource not found
                    example: Resource not found
                required:
                - statusCode
                - error
                - message
        '429':
          description: You have exceeded the rate limit. Please check the rate limit docs for more information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 429
                    examples:
                    - 429
                    example: 429
                  error:
                    type: string
                    enum:
                    - Too Many Requests
                    examples:
                    - Too Many Requests
                    example: Too Many Requests
                  message:
                    type: string
                    examples:
                    - Rate limit exceeded
                    example: Rate limit exceeded
                required:
                - statusCode
                - error
                - message
  /api/v2/accounts/analytics/daily:
    get:
      operationId: getDailyAccountAnalytics
      summary: Get daily account analytics
      tags:
      - Analytics
      description: Get daily account analytics showing the number of emails sent per day for each email account. Useful for tracking daily sending activity across your accounts.
      parameters:
      - schema:
          type: string
          example: '2024-01-01'
        examples:
          '2024-01-01':
            value: '2024-01-01'
          '2024-01-01T00:00:00.000Z':
            value: '2024-01-01T00:00:00.000Z'
        in: query
        name: start_date
        required: false
        description: Start date for the analytics period. Defaults to a 30-day window ending at end_date. The maximum range is 31 days.
      - schema:
          type: string
          example: '2024-01-31'
        examples:
          '2024-01-31':
            value: '2024-01-31'
          '2024-01-31T00:00:00.000Z':
            value: '2024-01-31T00:00:00.000Z'
        in: query
        name: end_date
        required: false
        description: End date for the analytics period. Defaults to the current date.
      - schema:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            examples:
            - user@example.com
            example: user@example.com
        in: query
        name: emails
        required: false
        description: Email accounts to include. This filter is required and accepts at most 200 unique accounts.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      description: The date of the analytics entry, in YYYY-MM-DD format
                      example: '2024-01-15'
                    email_account:
                      type: string
                      description: The email account that sent the emails
                      example: user@example.com
                    sent:
                      type: integer
                      description: The total number of campaign emails sent on this date by this account, including emails for subsequences
                      example: 150
                    bounced:
                      type: integer
                      description: The number of emails that bounced on this date for this account for campaigns - including subsequences
                      example: 3
                    contacted:
                      type: integer
                      description: The total number of unique contacts who received an email on this date from this account
                      example: 120
                    new_leads_contacted:
                      type: integer
                      description: The total number of new leads contacted on this date from this account
                      example: 50
                    opened:
                      type: integer
                      description: The total number of opened emails on this date for this account
                      example: 99
                    unique_opened:
                      type: integer
                      description: The total number of unique opened emails on this date for this account
                      example: 60
                    replies:
                      type: integer
                      description: The total number of replies received on this date for this account
                      example: 8
                    unique_replies:
                      type: integer
                      description: The total number of unique replies received on this date for this account
                      example: 7
                    replies_automatic:
                      type: integer
                      description: The total number of automatic replies detected on this date for this account
                      example: 2
                    unique_replies_automatic:
                      type: integer
                      description: The total number of unique automatic replies detected on this date for this account
                      example: 1
                    clicks:
                      type: integer
                      description: The total number of links clicked on this date for this account
                      example: 30
                    unique_clicks:
                      type: integer
                      description: The total number of unique links clicked on this date for this account. Unique meaning from unique leads, not unique links
                      example: 20
                  required:
                  - date
                  - email_account
                  - sent
                  - bounced
                  - contacted
                  - new_leads_contacted
                  - opened
                  - unique_opened
                  - replies
                  - unique_replies
                  - replies_automatic
                  - unique_replies_automatic
                  - clicks
                  - unique_clicks
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message
                    example: Start Date must be earlier than End Date
        '401':
          description: This request is unauthorized (either the Authorization header is missing or invalid, or the API key has been revoked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 401
                    examples:
