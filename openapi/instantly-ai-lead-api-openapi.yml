components:
  schemas:
    BackgroundJob:
      title: Background Job
      description: A background job that can be used to perform long-running tasks
      x-tags:
      - Schemas
      - BackgroundJob
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the background job
          readOnly: true
          example: 675266e304a8e55b17f0228b
        workspace_id:
          type: string
          description: Workspace ID
          readOnly: true
          format: uuid
          example: 019ffad2-5c7d-70c2-b6ec-8a2d0ca3333c
        user_id:
          type:
          - 'null'
          - string
          description: The id of the user that triggered the action that created the job
          readOnly: true
          format: uuid
          example: 019ffad2-5c7d-70c2-b6ec-8a2e0ec0b7f1
        type:
          type: string
          description: Type of background job
          enum:
          - move-leads
          - import-leads
          - export-leads
          - update-warmup-accounts
          - rename-variable
          - broadcast-ai-generate
          - broadcast-website-scrape
          - import-subscribers-from-crm
          - resync-subscriber-crm-tags
          x-enumDescriptions:
            move-leads: Move Leads
            import-leads: Import Leads
            export-leads: Export Leads
            update-warmup-accounts: Update Warmup Accounts
            rename-variable: Rename Variable
            broadcast-ai-generate: AI broadcast generation
            broadcast-website-scrape: Broadcast website analysis
            import-subscribers-from-crm: Import Subscribers From CRM
            resync-subscriber-crm-tags: Re-sync Subscriber CRM Tags
          example: move-leads
        entity_id:
          type:
          - 'null'
          - string
          description: The id of the entity that the job is related to
          format: uuid
          example: 019ffad2-5c7d-70c2-b6ec-8a2f7b30b3ce
        entity_type:
          type: string
          description: Type of entity
          enum:
          - list
          - campaign
          - workspace
          - broadcast
          - subscriber-group-sync
          - subscriber-group
          x-enumDescriptions:
            list: The entity is a lead list
            campaign: The entity is a campaign
            workspace: The entity is a workspace
            broadcast: The entity is an email-marketing broadcast
            subscriber-group-sync: The entity is a subscriber-group sync
            subscriber-group: The entity is a subscriber group
          example: list
        data:
          type: object
          description: Data about the job, used to store any additional information we need to process the job
          properties:
            moved_lead_emails:
              type: array
              description: For `move-leads` jobs, up to the first 10,000 email addresses of leads that actually moved or copied to the destination after all filters were applied. Use `moved_leads` for the full count.
              items:
                type: string
                format: email
                example: jane@example.com
              example:
              - jane@example.com
              - john@example.com
          additionalProperties: true
        progress:
          type: number
          description: Progress of the job as a percentage (from 0 to 100)
          minimum: 0
          maximum: 100
          example: 0
        status:
          type: string
          description: Job status
          enum:
          - pending
          - in-progress
          - success
          - failed
          - draining
          - paused
          - cancelled
          x-enumDescriptions:
            pending: The background job is waiting in the queue to be processed
            in-progress: The background job is being processed
            success: The background job has been successfully processed
            failed: The background job has failed
            draining: The background job is replaying deferred live events
            paused: The background job is paused (e.g. waiting for quota or auth)
            cancelled: The background job was cancelled by the user
          example: pending
        created_at:
          type: string
          description: Timestamp when the job was created
          example: '2026-08-13T11:11:58.077Z'
        updated_at:
          type: string
          description: Timestamp when the job was last updated
          example: '2026-08-13T11:11:58.077Z'
      required:
      - id
      - workspace_id
      - type
      - progress
      - status
      - created_at
      - updated_at
      additionalProperties: false
    Lead:
      title: Lead
      description: A lead entity representing an individual lead
      x-tags:
      - Schemas
      - Lead
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the lead
          readOnly: true
          format: uuid
          example: 019ffad2-53a1-7acf-9ae0-404312bcab56
        timestamp_created:
          type: string
          description: Timestamp when the lead was created
          readOnly: true
          format: date-time
          example: '2026-08-13T11:11:55.811Z'
        timestamp_updated:
          type: string
          description: Timestamp when the lead was last updated
          readOnly: true
          format: date-time
          example: '2026-08-13T11:11:55.811Z'
        organization:
          type: string
          description: Organization ID associated with the lead
          readOnly: true
          format: uuid
          example: 019ffad2-53a3-7590-935f-b48baa581e0d
        campaign:
          type:
          - 'null'
          - string
          description: Campaign ID associated with the lead
          format: uuid
          example: 019ffad2-53a3-7590-935f-b48cddbf2d9e
        status:
          type: number
          description: Status of the lead
          readOnly: true
          enum:
          - 1
          - 2
          - 3
          - -1
          - -2
          - -3
          x-enumDescriptions:
            '1': Active
            '2': Paused
            '3': Completed
            '-1': Bounced
            '-2': Unsubscribed
            '-3': Skipped
          example: 1
        email:
          type:
          - 'null'
          - string
          description: Email address of the lead
          example: example@example.com
        personalization:
          type:
          - 'null'
          - string
          description: Personalization of the lead
          example: Hello, how are you?
        website:
          type:
          - 'null'
          - string
          description: Website of the lead
          example: https://example.com
        last_name:
          type:
          - 'null'
          - string
          description: Last name of the lead
          example: Doe
        first_name:
          type:
          - 'null'
          - string
          description: First name of the lead
          example: John
        company_name:
          type:
          - 'null'
          - string
          description: Company name of the lead
          example: Example Inc.
        job_title:
          type:
          - 'null'
          - string
          description: Job title of the lead
          example: Head of Growth
        phone:
          type:
          - 'null'
          - string
          description: Phone number of the lead
          example: '+1234567890'
        email_open_count:
          type: number
          description: Number of times the email was opened
          readOnly: true
          example: 0
        email_reply_count:
          type: number
          description: Number of times the email was replied to
          readOnly: true
          example: 0
        email_click_count:
          type: number
          description: Number of times the email was clicked
          readOnly: true
          example: 0
        company_domain:
          type: string
          description: Company domain of the lead
          readOnly: true
          example: example.com
        status_summary:
          type: object
          description: Status summary of the lead
          readOnly: true
          properties:
            lastStep:
              type: object
              properties:
                from:
                  type: string
                  example: campaign
                stepID:
                  type: string
                  example: 019ffad2-53a3-7590-935f-b48d6ba341ae
                timestamp_executed:
                  type: string
                  format: date-time
                  example: '2026-08-13T11:11:55.811Z'
            domain_complete:
              type: boolean
              example: true
        payload:
          type:
          - 'null'
          - object
          description: Lead custom variables. This object can contain any key, but the values have to be of type string, number, boolean, or null. We do NOT allow objects or arrays as values.
          readOnly: true
          properties:
            firstName:
              type: string
              examples:
              - John
              example: John
            lastName:
              type: string
              examples:
              - Doe
              example: Doe
            companyName:
              type: string
              examples:
              - Acme Corp
              example: Acme Corp
            jobTitle:
              type: string
              examples:
              - Head of Growth
              example: Head of Growth
            website:
              type: string
              examples:
              - https://example.com
              example: https://example.com
            phone:
              type: string
              examples:
              - '+1234567890'
              example: '+1234567890'
            personalization:
              type: string
              examples:
              - Hi {{first_name}}, I noticed you work at {{company_name}}...
              example: Hi {{first_name}}, I noticed you work at {{company_name}}...
          additionalProperties:
            type:
            - 'null'
            - string
            - number
            - boolean
            - object
        status_summary_subseq:
