                  type: string
                  description: The search query to filter leads by.
                  example: test
                filter:
                  type: string
                  enum:
                  - FILTER_VAL_CONTACTED
                  - FILTER_VAL_NOT_CONTACTED
                  - FILTER_VAL_COMPLETED
                  - FILTER_VAL_UNSUBSCRIBED
                  - FILTER_VAL_ACTIVE
                  - FILTER_LEAD_INTERESTED
                  - FILTER_LEAD_NOT_INTERESTED
                  - FILTER_LEAD_MEETING_BOOKED
                  - FILTER_LEAD_MEETING_COMPLETED
                  - FILTER_LEAD_CLOSED
                  - FILTER_LEAD_OUT_OF_OFFICE
                  - FILTER_LEAD_WRONG_PERSON
                  - FILTER_LEAD_LOST
                  - FILTER_LEAD_NO_SHOW
                  - FILTER_LEAD_CUSTOM_LABEL_POSITIVE
                  - FILTER_LEAD_CUSTOM_LABEL_NEGATIVE
                  - FILTER_VAL_BOUNCED
                  - FILTER_VAL_SKIPPED
                  - FILTER_VAL_RISKY
                  - FILTER_VAL_INVALID
                  - FILTER_VAL_VALID
                  - FILTER_VAL_IN_SUBSEQUENCE
                  - FILTER_VAL_OPENED_NO_REPLY
                  - FILTER_VAL_COMPLETED_NO_REPLY
                  - FILTER_VAL_NO_OPENS
                  - FILTER_VAL_REPLIED
                  - FILTER_VAL_LINK_CLICKED
                  description: The filter to apply to the leads.
                  example: FILTER_LEAD_CLOSED
                campaign:
                  type: string
                  format: uuid
                  description: The ID of the campaign to filter leads by.
                  example: 019ffad2-9c4b-7871-94ec-7c3113254b8f
                list_id:
                  type: string
                  format: uuid
                  description: The ID of the list to filter leads by.
                  example: 019ffad2-9c4b-7871-94ec-7c32b22f5b96
                in_campaign:
                  type: boolean
                  description: Whether the leads are in the campaign.
                  example: true
                in_list:
                  type: boolean
                  description: Whether the leads are in the list.
                  example: true
                organization_user_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                    example: 019ffad2-9c4b-7871-94ec-7c3334c55b26
                  minItems: 1
                smart_view_id:
                  type: string
                  format: uuid
                  description: The ID of the smart view to filter leads by.
                  example: 019ffad2-9c4b-7871-94ec-7c34c7724780
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                    example: 019ffad2-9c4b-7871-94ec-7c35f4f00a6b
                  description: The IDs of the leads to filter by.
                limit:
                  type: integer
                  minimum: 0
                  description: The limit of the number of leads to return.
                  example: 10
                queries:
                  type: array
                  items:
                    type: object
                    properties:
                      actionType:
                        type: string
                        enum:
                        - reply
                        - email-open
                        - last-contacted
                        - link-click
                        - lead-status
                        - lead-status-change
                        x-enumDescriptions:
                          reply: Reply
                          email-open: Email Opened
                          last-contacted: Last Contacted
                          link-click: Link Click
                          lead-status: Lead Status
                          lead-status-change: Lead Status Change
                        example: email-open
                      values:
                        type: object
                        properties:
                          occurrence-days:
                            type: number
                            example: 5
                          occurrence-count:
                            type: object
                            properties:
                              condition:
                                type: string
                                enum:
                                - more
                                - less
                                - equal
                                x-enumDescriptions:
                                  more: More than the count
                                  less: Less than the count
                                  equal: Equal to the count
                                example: more
                              count:
                                type: number
                                example: 5
                          lead-status:
                            type: object
                            properties:
                              status:
                                type: number
                                example: 5
                              condition:
                                type: string
                                enum:
                                - is
                                - is-not
                                x-enumDescriptions:
                                  is: Is
                                  is-not: Is Not
                                example: is
                    required:
                    - actionType
                    - values
                assigned_to:
                  type: string
                  format: uuid
                  description: Filter leads by their current owner (the user they are currently assigned to).
                  example: 019ffad2-9c4b-7871-94ec-7c36f676e920
                has_clause:
                  type: boolean
                  description: Whether this endpoint should list data based on the filters currently applied in the web app.
                  example: true
              required:
              - organization_user_ids
        required: true
      responses:
        '202':
          description: Default Response
