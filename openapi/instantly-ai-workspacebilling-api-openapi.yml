                    example: Too Many Requests
                  message:
                    type: string
                    examples:
                    - Rate limit exceeded
                    example: Rate limit exceeded
                required:
                - statusCode
                - error
                - message
  /api/v2/workspace-billing/subscription-details:
    get:
      operationId: getWorkspaceSubscriptionDetails
      summary: Get workspace subscription details
      tags:
      - WorkspaceBilling
      description: 'Requires one of the following scopes: `workspace_billing:read`, `workspace_billing:all`, `all:read`, `all:all`'
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        workspace_id:
                          type: string
                          format: uuid
                          description: The ID of the workspace
                          example: 019ffad2-9ced-7732-80e2-44f826e6e3cf
                        interval:
                          type: string
                          enum:
                          - month
                          - year
                          description: The billing interval of the subscription
                          example: month
                        quantity:
                          type: number
                          description: The quantity of subscribed items
                          example: 1
                        product_id:
                          type: string
                          description: The Id of outreach plan subscribed to
                          enum:
                          - pid_ls_v1
                          - pid_hg_v1
                          - pid_g_v1
                          - pid_g_v2
                          - pid_nic_v1
                          - pid_nic_v1_annual
                          - pid_gic_v1
                          - pid_gic_v1_annual
                          - pid_sic_v1
                          - pid_sic_v1_annual
                          - pid_hic_v1
                          - pid_hic_v1_annual
                          - pid_verify_v1_monthly
                          - pid_hv_v1
                          - pid_hv_v1_annual
                          - pid_lsv_v1
                          - pid_lsv_v1_annual
                          - pid_crm_hg
