openapi: 3.2.0
info:
  title: Explorer Account API
  description: The entire API V2 documentation is interactive and can be tested here. To the right side of every endpoint you will see a box with an example request. You can click on the "Try it" button to send a request to the server right from the docs. You will need to provide an API key by clicking the `ApiKeyAuth_token` blue text.
  version: 2.0.0
servers:
- url: https://api.instantly.ai
  description: Instantly API Server
security:
- ApiKeyAuth: []
tags:
- name: Account
  description: An email account that can be used to send campaigns
  x-group: Account
paths:
  /api/v2/accounts:
    post:
      operationId: createAccount
      summary: Create account
      tags:
      - Account
      description: 'Requires one of the following scopes: `accounts:create`, `accounts:all`, `all:create`, `all:all`'
      requestBody:
        content:
          application/json:
            schema:
              title: CreateAccount
              description: The Account to create
              type: object
              properties:
                email:
                  type: string
                  description: Email address of the account
                  format: email
                  example: user@example.com
                first_name:
                  type: string
                  description: First name associated with the account
                  example: John
                last_name:
                  type: string
                  description: Last name associated with the account
                  example: Doe
                warmup:
                  type: object
                  description: Warmup configuration for the account
                  properties:
                    limit:
                      type: number
                      description: Email sending limit for the account
                      example: 100
                    advanced:
                      type: object
                      description: Advanced settings for the account
                      properties:
                        warm_ctd:
                          type: boolean
                          description: Whether the account is in warm CTD mode
                          example: false
                        open_rate:
                          type: number
                          description: Email open rate for the account
                          example: 0.95
                        important_rate:
                          type: number
                          description: Important email rate for the account
                          example: 0.8
                        read_emulation:
                          type: boolean
                          description: Whether read emulation is enabled
                          example: true
                        spam_save_rate:
                          type: number
                          description: Spam save rate for the account
                          example: 0.02
                        weekday_only:
                          type: boolean
                          description: Whether to send emails only on weekdays
                          example: true
                    warmup_custom_ftag:
                      type: string
                      description: Custom tag for the account
                      example: warmup
                    increment:
                      type: string
                      enum:
                      - disabled
                      - '0'
                      - '1'
                      - '2'
                      - '3'
                      - '4'
                      x-enumDescriptions:
                        '0': '0'
                        '1': '1'
                        '2': '2'
                        '3': '3'
                        '4': '4'
                        disabled: Disabled
                      description: Daily increment added to the sending limit, starting from 0, until the full daily limit is reached (slow ramp). Gradually increases sending volume to improve deliverability. Set to `disabled` to send at the full daily limit from day one.
                      example: disabled
                    reply_rate:
                      type: number
                      description: Reply rate for the account
                      example: 0.1
                daily_limit:
                  type:
                  - number
                  - 'null'
                  description: Daily email sending limit
                  example: 100
                tracking_domain_name:
                  type:
                  - string
                  - 'null'
                  description: Tracking domain
                  example: example.com
                tracking_domain_status:
                  type:
                  - string
                  - 'null'
                  description: Tracking domain status
                  example: active
                enable_slow_ramp:
                  type:
                  - boolean
                  - 'null'
                  description: Whether to enable slow ramp up for sending limits
                  example: false
                inbox_placement_test_limit:
                  type:
                  - number
                  - 'null'
                  description: The limit for inbox placement tests
                  minimum: 0
                  example: 10
                provider_code:
                  type: number
                  description: Provider code for the account. Please make sure to specify the right provider code, otherwise your account will not work.
                  enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 8
                  - 11
                  x-enumDescriptions:
                    '1': Custom IMAP/SMTP
                    '2': Google
                    '3': Microsoft
                    '4': AWS
                    '8': AirMail
                    '11': Airmail Instant
                  example: 2
                sending_gap:
                  type: number
                  description: The gap between emails sent from this account in minutes (minimum wait time when used with multiple campaigns)
                  minimum: 0
                  maximum: 1440
                  example: 10
                signature:
                  type:
                  - string
                  - 'null'
                  description: Email signature for the account
                  example: Best regards, John Doe
                reply_to:
                  type: string
                  example: reply@example.com
                imap_username:
                  type: string
                  example: username
                imap_password:
                  type: string
                  example: password
                imap_host:
                  type: string
                  example: imap.gmail.com
                imap_port:
                  type: number
                  example: 993
                smtp_username:
                  type: string
                  example: username
                smtp_password:
                  type: string
                  example: password
                smtp_host:
                  type: string
                  example: smtp.gmail.com
                smtp_port:
                  type: number
                  example: 587
                warmup_custom_ftag:
                  type: string
                  example: warmup
                skip_cname_check:
                  type: boolean
                  example: false
              required:
              - email
              - first_name
              - last_name
              - provider_code
              - imap_username
              - imap_password
              - imap_host
              - imap_port
              - smtp_username
              - smtp_password
              - smtp_host
              - smtp_port
              additionalProperties: false
        required: true
        description: The Account to create
      responses:
        '200':
          description: The Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid request body (e.g. missing required fields, or invalid field values)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 400
                    examples:
                    - 400
                    example: 400
                  error:
                    type: string
                    enum:
                    - Bad Request
                    examples:
                    - Bad Request
                    example: Bad Request
                  message:
                    type: string
                    examples:
                    - body must have required property 'name'
                    example: body must have required property 'name'
                required:
                - statusCode
                - error
                - message
        '401':
          description: This request is unauthorized (either the Authorization header is missing or invalid, or the API key has been revoked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 401
                    examples:
                    - 401
                    example: 401
                  error:
                    type: string
                    enum:
                    - Unauthorized
                    examples:
                    - Unauthorized
                    example: Unauthorized
                  message:
                    type: string
                    examples:
                    - Missing Authorization header
                    example: Missing Authorization header
                required:
                - statusCode
                - error
                - message
        '402':
          description: This request cannot be fulfilled because the workspace does not have an active paid plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 402
                    examples:
                    - 402
                    example: 402
                  error:
                    type: string
                    enum:
                    - Payment Required
                    examples:
                    - Payment Required
                    example: Payment Required
                  message:
                    type: string
                    examples:
                    - Workspace does not have an active paid plan
                    example: Workspace does not have an active paid plan
                required:
                - statusCode
                - error
                - message
        '404':
          description: The requested resource was not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 404
                    examples:
                    - 404
                    example: 404
                  error:
                    type: string
                    enum:
                    - Not Found
                    examples:
                    - Not Found
                    example: Not Found
                  message:
                    type: string
                    examples:
                    - Resource not found
                    example: Resource not found
                required:
                - statusCode
                - error
                - message
        '429':
          description: You have exceeded the rate limit. Please check the rate limit docs for more information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 429
                    examples:
                    - 429
                    example: 429
                  error:
                    type: string
                    enum:
                    - Too Many Requests
                    examples:
                    - Too Many Requests
                    example: Too Many Requests
                  message:
                    type: string
                    examples:
                    - Rate limit exceeded
                    example: Rate limit exceeded
                required:
                - statusCode
                - error
                - message
