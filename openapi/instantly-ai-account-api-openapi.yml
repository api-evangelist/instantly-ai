                    - Not Found
                    example: Not Found
                  message:
                    type: string
                    examples:
                    - Resource not found
                    example: Resource not found
                required:
                - statusCode
                - error
                - message
        '429':
          description: You have exceeded the rate limit. Please check the rate limit docs for more information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 429
                    examples:
                    - 429
                    example: 429
                  error:
                    type: string
                    enum:
                    - Too Many Requests
                    examples:
                    - Too Many Requests
                    example: Too Many Requests
                  message:
                    type: string
                    examples:
                    - Rate limit exceeded
                    example: Rate limit exceeded
                required:
                - statusCode
                - error
                - message
components:
  schemas:
    BackgroundJob:
      title: Background Job
      description: A background job that can be used to perform long-running tasks
      x-tags:
      - Schemas
      - BackgroundJob
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the background job
          readOnly: true
          example: 675266e304a8e55b17f0228b
        workspace_id:
          type: string
          description: Workspace ID
          readOnly: true
          format: uuid
          example: 019ffad2-5c7d-70c2-b6ec-8a2d0ca3333c
        user_id:
          type:
          - 'null'
          - string
          description: The id of the user that triggered the action that created the job
          readOnly: true
          format: uuid
          example: 019ffad2-5c7d-70c2-b6ec-8a2e0ec0b7f1
        type:
          type: string
          description: Type of background job
          enum:
          - move-leads
          - import-leads
          - export-leads
          - update-warmup-accounts
          - rename-variable
          - broadcast-ai-generate
          - broadcast-website-scrape
          - import-subscribers-from-crm
          - resync-subscriber-crm-tags
          x-enumDescriptions:
            move-leads: Move Leads
            import-leads: Import Leads
            export-leads: Export Leads
            update-warmup-accounts: Update Warmup Accounts
            rename-variable: Rename Variable
            broadcast-ai-generate: AI broadcast generation
            broadcast-website-scrape: Broadcast website analysis
            import-subscribers-from-crm: Import Subscribers From CRM
            resync-subscriber-crm-tags: Re-sync Subscriber CRM Tags
          example: move-leads
        entity_id:
          type:
          - 'null'
          - string
          description: The id of the entity that the job is related to
          format: uuid
          example: 019ffad2-5c7d-70c2-b6ec-8a2f7b30b3ce
        entity_type:
          type: string
          description: Type of entity
          enum:
          - list
          - campaign
          - workspace
          - broadcast
          - subscriber-group-sync
          - subscriber-group
          x-enumDescriptions:
            list: The entity is a lead list
            campaign: The entity is a campaign
            workspace: The entity is a workspace
            broadcast: The entity is an email-marketing broadcast
            subscriber-group-sync: The entity is a subscriber-group sync
            subscriber-group: The entity is a subscriber group
          example: list
        data:
          type: object
          description: Data about the job, used to store any additional information we need to process the job
          properties:
            moved_lead_emails:
              type: array
              description: For `move-leads` jobs, up to the first 10,000 email addresses of leads that actually moved or copied to the destination after all filters were applied. Use `moved_leads` for the full count.
              items:
                type: string
                format: email
                example: jane@example.com
              example:
              - jane@example.com
              - john@example.com
          additionalProperties: true
        progress:
          type: number
          description: Progress of the job as a percentage (from 0 to 100)
          minimum: 0
          maximum: 100
          example: 0
        status:
          type: string
          description: Job status
          enum:
          - pending
          - in-progress
          - success
          - failed
          - draining
          - paused
          - cancelled
          x-enumDescriptions:
            pending: The background job is waiting in the queue to be processed
            in-progress: The background job is being processed
            success: The background job has been successfully processed
            failed: The background job has failed
            draining: The background job is replaying deferred live events
            paused: The background job is paused (e.g. waiting for quota or auth)
            cancelled: The background job was cancelled by the user
          example: pending
        created_at:
          type: string
          description: Timestamp when the job was created
          example: '2026-08-13T11:11:58.077Z'
        updated_at:
          type: string
          description: Timestamp when the job was last updated
          example: '2026-08-13T11:11:58.077Z'
      required:
      - id
      - workspace_id
      - type
      - progress
      - status
      - created_at
      - updated_at
      additionalProperties: false
    Account:
      title: Account
      description: An email account that can be used to send campaigns
      x-tags:
      - Schemas
      - Account
      type: object
      properties:
        email:
          type: string
          description: Email address of the account
          format: email
          example: user@example.com
        timestamp_created:
          type: string
          description: Timestamp when the account was created
          readOnly: true
          format: date-time
          example: '2026-08-13T11:11:58.093Z'
        timestamp_updated:
          type: string
          description: Timestamp when the account was last updated
          readOnly: true
          format: date-time
          example: '2026-08-13T11:11:58.093Z'
        first_name:
          type: string
          description: First name associated with the account
          example: John
        last_name:
          type: string
          description: Last name associated with the account
          example: Doe
        warmup:
          type: object
          description: Warmup configuration for the account
          properties:
            limit:
              type: number
              description: Email sending limit for the account
              example: 100
            advanced:
              type: object
              description: Advanced settings for the account
              properties:
                warm_ctd:
                  type: boolean
                  description: Whether the account is in warm CTD mode
                  example: false
                open_rate:
                  type: number
                  description: Email open rate for the account
                  example: 0.95
                important_rate:
                  type: number
                  description: Important email rate for the account
                  example: 0.8
                read_emulation:
                  type: boolean
                  description: Whether read emulation is enabled
                  example: true
                spam_save_rate:
                  type: number
                  description: Spam save rate for the account
                  example: 0.02
                weekday_only:
                  type: boolean
                  description: Whether to send emails only on weekdays
                  example: true
            warmup_custom_ftag:
              type: string
              description: Custom tag for the account
              example: warmup
            increment:
              type: string
              enum:
              - disabled
              - '0'
              - '1'
              - '2'
              - '3'
              - '4'
              x-enumDescriptions:
                '0': '0'
                '1': '1'
                '2': '2'
                '3': '3'
                '4': '4'
                disabled: Disabled
              description: Daily increment added to the sending limit, starting from 0, until the full daily limit is reached (slow ramp). Gradually increases sending volume to improve deliverability. Set to `disabled` to send at the full daily limit from day one.
              example: disabled
            reply_rate:
              type: number
              description: Reply rate for the account
              example: 0.1
        added_by:
          type:
          - 'null'
          - string
          description: User ID who added the account
          readOnly: true
          format: uuid
          example: 019ffad2-5c8d-7f3d-bee3-56986ea16c41
        daily_limit:
          type:
          - 'null'
          - number
          description: Daily email sending limit
          example: 100
        daily_limit_max:
          type:
          - 'null'
          - number
          description: Maximum daily email sending limit for AirMail accounts
          readOnly: true
          example: 100
        warmup_limit_max:
          type:
          - 'null'
          - number
          description: Maximum daily warmup sending limit for AirMail accounts
          readOnly: true
          example: 100
        modified_by:
          type:
          - 'null'
          - string
          description: User ID who last modified the account
          readOnly: true
          format: uuid
          example: 019ffad2-5c8d-7f3d-bee3-56990262e845
        tracking_domain_name:
          type:
          - 'null'
          - string
          description: Tracking domain
          example: example.com
        tracking_domain_status:
          type:
          - 'null'
          - string
          description: Tracking domain status
          example: active
        status:
          type: number
          description: Current status of the account
          readOnly: true
          enum:
          - 1
          - 2
          - 3
          - -1
          - -2
          - -3
          x-enumDescriptions:
            '1': Active
            '2': Paused
            '3': Temporarily paused for maintenance; will be automatically resumed shortly
            '-1': Connection Error
            '-2': Soft Bounce Error
            '-3': Sending Error
          example: 1
        enable_slow_ramp:
          type:
          - 'null'
          - boolean
          description: Whether to enable slow ramp up for sending limits
          example: false
        inbox_placement_test_limit:
          type:
          - 'null'
          - number
          description: The limit for inbox placement tests
          minimum: 0
          example: 10
        organization:
          type: string
          description: Organization ID that owns this account
          readOnly: true
          format: uuid
          example: 019ffad2-5c8d-7f3d-bee3-569acb8bcc4f
        warmup_status:
          type: number
          description: Current warmup status of the account
          readOnly: true
          enum:
          - 0
          - 1
          - -1
          - -2
          - -3
          x-enumDescriptions:
            '0': Paused
            '1': Active
            '-1': Banned
            '-2': Spam Folder Unknown
            '-3': Permanent Suspension
          example: 1
        status_message:
          type: object
          description: Status message for the account
          readOnly: true
          properties:
            code:
              type: string
              example: EENVELOPE
            command:
              type: string
              example: DATA
            response:
              type: string
              example: 550-5.4.5 Daily user sending limit exceeded. For more information on Gmai
            e_message:
              type: string
              example: 'error: data command failed: 550-5.4.5 daily user sending limit exceeded'
            responseCode:
              type: number
              example: 550
          additionalProperties: true
        timestamp_warmup_start:
          type:
          - 'null'
          - string
          description: Timestamp when warmup was started
          readOnly: true
          format: date-time
          example: '2026-08-13T11:11:58.093Z'
        provider_code:
          type: number
          description: Provider code for the account. Please make sure to specify the right provider code, otherwise your account will not work.
          enum:
          - 1
          - 2
          - 3
          - 4
          - 8
          - 11
          x-enumDescriptions:
            '1': Custom IMAP/SMTP
            '2': Google
            '3': Microsoft
            '4': AWS
            '8': AirMail
            '11': Airmail Instant
          example: 2
        setup_pending:
          type: boolean
          description: Whether account setup is pending
          readOnly: true
          example: false
        is_managed_account:
          type: boolean
          description: Whether this is a managed account
          readOnly: true
          example: false
        stat_warmup_score:
          type:
          - 'null'
          - number
          description: Warmup score for the account
          readOnly: true
          example: 85
        sending_gap:
          type: number
          description: The gap between emails sent from this account in minutes (minimum wait time when used with multiple campaigns)
          minimum: 0
          maximum: 1440
          example: 10
        signature:
          type:
          - 'null'
          - string
          description: Email signature for the account
          example: Best regards, John Doe
        reply_to:
          type:
          - 'null'
          - string
          description: Custom reply-to email address for the account
          format: email
          example: reply@example.com
        autofix_failed:
          type:
          - 'null'
          - boolean
          description: Whether automatic reconnection attempts have failed. null = in progress, true = failed, false = succeeded.
          readOnly: true
          example: false
      required:
      - email
      - timestamp_created
      - timestamp_updated
      - first_name
      - last_name
      - organization
      - warmup_status
      - provider_code
      - setup_pending
      - is_managed_account
      additionalProperties: false
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
