components:
  schemas:
    LeadLabel:
      title: Lead Label
      description: A custom label for categorizing and managing leads
      x-tags:
      - Schemas
      - LeadLabel
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the custom lead label
          readOnly: true
          format: uuid
          example: 019ffad2-5c9b-7ff3-9287-8976b56d4ef2
        timestamp_created:
          type: string
          description: Timestamp when the custom lead label was created
          readOnly: true
          format: date-time
          example: '2026-08-13T11:11:58.107Z'
        created_by:
          type: string
          description: User ID of the creator of this label
          readOnly: true
          format: uuid
          example: 019ffad2-5c9b-7ff3-9287-897737ef85de
        organization_id:
          type: string
          description: Organization ID that owns this custom lead label
          readOnly: true
          format: uuid
          example: 019ffad2-5c9b-7ff3-9287-897806175ea0
        label:
          type: string
          description: Display label for the custom lead label
          example: Hot Lead
        interest_status_label:
          type: string
          description: Interest status label associated with this label
          enum:
          - positive
          - negative
          - neutral
          x-enumDescriptions:
            positive: Positive
            negative: Negative
            neutral: Neutral
          example: positive
        interest_status:
          type: number
          description: Interest status associated with this label. This is generated automatically by us.
          readOnly: true
          example: 1
        description:
          type:
          - 'null'
          - string
          description: Detailed description of the custom lead label purpose
          example: Used for marking high-priority leads
        use_with_ai:
          type:
          - 'null'
          - boolean
          description: Whether this label should be used with AI features
          example: false
      required:
      - id
      - timestamp_created
      - created_by
      - organization_id
      - label
      - interest_status_label
      - interest_status
      additionalProperties: false
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
