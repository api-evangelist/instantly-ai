    post:
      operationId: testAiReplyLabelLeadLabels
      summary: Test AI reply label prediction
      tags:
      - LeadLabel
      description: 'Returns the AI-predicted lead label for a reply text. This simulates how AI auto-tagging would label an incoming reply for testing custom labels and descriptions. Rate limit: 500 requests per 30 days per workspace. This rate limit applies only to this testing endpoint; live reply processing does not use this limiter.


        Requires one of the following scopes: `lead-labels:read`, `lead-labels:all`, `all:read`, `all:all`'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reply_text:
                  type: string
                  description: The reply text to classify.
                  example: Thanks for reaching out. I am interested in learning more.
              required:
              - reply_text
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: The predicted lead label.
                    example: Hot Lead
                  custom_labels_considered:
                    type: array
                    items:
                      type: string
                      example: Hot Lead
                    description: AI-enabled custom labels considered during classification.
                    example:
