components:
  schemas:
    CampaignSubsequence:
      title: Campaign Subsequence
      description: A subsequence entity representing a follow-up sequence
      x-tags:
      - Schemas
      - CampaignSubsequence
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the subsequence
          readOnly: true
          format: uuid
          example: 019ffad2-5cc7-76f5-9fd3-25f814e7aa6b
        timestamp_created:
          type: string
          description: Timestamp when the subsequence was created
          readOnly: true
          format: date-time
          example: '2026-08-13T11:11:58.151Z'
        parent_campaign:
          type: string
          description: ID of the parent campaign
          format: uuid
          example: 019ffad2-5cc7-76f5-9fd3-25f990e43646
        workspace:
          type: string
          description: ID of the workspace this subsequence belongs to
          readOnly: true
          format: uuid
          example: 019ffad2-5cc7-76f5-9fd3-25fa299a0c6f
        status:
          type: number
          description: Status of the subsequence
          readOnly: true
          enum:
          - -99
          - -1
          - -2
          - 0
          - 1
          - 2
          - 3
          - 4
          x-enumDescriptions:
            '0': Draft - The subsequence is in draft mode and not yet active
            '1': Active - The subsequence is currently running
            '2': Paused - The subsequence has been manually paused
            '3': Completed - The subsequence has finished running
            '4': Running Subsequences - The subsequence has active child sequences
            '-99': Account Suspended - The subsequence is suspended due to account issues
            '-1': Accounts Unhealthy - The subsequence is paused due to unhealthy sending accounts
            '-2': Bounce Protection - The subsequence is paused due to high bounce rates
          example: 0
        timestamp_leads_updated:
          type: string
          description: Timestamp when the leads were last updated
          readOnly: true
          format: date-time
          example: '2026-08-13T11:11:58.151Z'
        name:
          type: string
          description: Name of the subsequence
          example: Follow-up sequence
        conditions:
          type: object
          description: Conditions that trigger the subsequence
          properties:
            crm_status:
              type: array
              description: Lead CRM statuses that trigger the subsequence. Accepts the built-in statuses listed below, or the interest status of a custom lead label.
              items:
                type: number
                minimum: -30000
                maximum: 30000
                x-enumDescriptions:
                  '0': Out of Office
                  '1': Interested
                  '2': Meeting Booked
                  '3': Meeting Completed
                  '4': Won
                  '-1': Not Interested
                  '-2': Wrong Person
                  '-3': Lost
                  '-4': No Show
                example: 1
            lead_activity:
              type: array
              description: Lead activities that trigger the subsequence.
              items:
                type: number
                enum:
                - 4
                - 91
                - 2
                x-enumDescriptions:
                  '2': Email Opened - Triggered when a lead opens an email
                  '4': Email Link Clicked - Triggered when a lead clicks a link in an email
                  '91': Campaign Completed Without Reply - Triggered when a campaign completes for a lead without receiving a reply
                example: 4
            reply_contains:
              type: string
              example: 'yes'
        subsequence_schedule:
          type: object
          description: Schedule configuration for the subsequence. When omitted on create, inherits the parent campaign's schedule.
          properties:
            start_date:
              type:
              - 'null'
              - string
              format: date
              description: Start date in YYYY-MM-DD format. Uses the campaign's timezone.
              example: '2025-09-25'
            end_date:
              type:
              - 'null'
              - string
              format: date
              description: End date in YYYY-MM-DD format. Uses the campaign's timezone.
              example: '2025-09-25'
            schedules:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: My Schedule
                  timing:
                    type: object
                    properties:
                      from:
                        type: string
                        pattern: ^([01][0-9]|2[0-3]):([0-5][0-9])$
                        example: 09:00
                      to:
                        type: string
                        pattern: ^([01][0-9]|2[0-3]):([0-5][0-9])$
                        example: '17:00'
                    required:
                    - from
                    - to
                  days:
                    type: object
                    minProperties: 1
                    properties:
                      '0':
                        type: boolean
                        example: true
