  /api/v2/subsequences/{id}/analytics/steps:
    get:
      operationId: getSubsequenceStepsAnalytics
      summary: Get subsequence step and variant analytics
      tags:
      - CampaignSubsequence
      description: 'Returns engagement metrics grouped by zero-based step and variant for one subsequence. Results include only activity from the requested subsequence, excluding its parent campaign and sibling subsequences.


        Requires one of the following scopes: `subsequences:read`, `subsequences:all`, `all:read`, `all:all`'
      parameters:
      - schema:
          type: string
          example: '2024-01-01'
        examples:
          '2024-01-01':
            value: '2024-01-01'
          '2024-01-01T12:00:00.000Z':
            value: '2024-01-01T12:00:00.000Z'
        in: query
        name: start_date
        required: false
        description: Inclusive start of the analytics range. Accepts a date-only value (`YYYY-MM-DD`) or an ISO 8601 timestamp. Timestamps are normalized to their UTC calendar date.
      - schema:
          type: string
          example: '2024-01-31'
        examples:
          '2024-01-31':
            value: '2024-01-31'
          '2024-01-31T23:59:59.999Z':
            value: '2024-01-31T23:59:59.999Z'
        in: query
        name: end_date
        required: false
        description: Inclusive end of the analytics range. Accepts a date-only value (`YYYY-MM-DD`) or an ISO 8601 timestamp. Timestamps are normalized to their UTC calendar date.
      - schema:
          type: string
          format: uuid
          example: 019ffad2-9c8b-7899-a0d0-1b1ac5dedeb4
        example: 019ffad2-9c8b-7899-a0d0-1b1ac5dedeb4
        in: path
        name: id
        required: true
        description: The ID of the subsequence to analyze.
      responses:
        '200':
          description: Engagement metrics grouped by subsequence step and variant.
          content:
            application/json:
              schema:
                type: array
                description: Engagement metrics grouped by subsequence step and variant.
                items:
                  type: object
