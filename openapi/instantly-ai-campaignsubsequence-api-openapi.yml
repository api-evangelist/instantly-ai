                      description: Zero-based variant index. `0` is variant A, `1` is variant B, and so on. Null when the event could not be attributed to a variant.
                      example: '0'
                    sent:
                      type: integer
                      description: Total emails sent from this step and variant.
                      example: 100
                    opened:
                      type: integer
                      description: Total open events attributed to this step and variant.
                      example: 45
                    unique_opened:
                      type: integer
                      description: Number of unique leads that opened an email from this step and variant.
                      example: 40
                    replies:
                      type: integer
                      description: Total replies attributed to this step and variant.
                      example: 12
                    unique_replies:
                      type: integer
                      description: Number of unique leads that replied to this step and variant.
                      example: 11
                    replies_automatic:
                      type: integer
                      description: Total automatic replies attributed to this step and variant.
                      example: 2
                    unique_replies_automatic:
                      type: integer
                      description: Number of unique leads that sent an automatic reply to this step and variant.
                      example: 2
                    clicks:
                      type: integer
                      description: Total link click events attributed to this step and variant.
                      example: 18
                    unique_clicks:
                      type: integer
                      description: Number of unique leads that clicked a link in this step and variant.
                      example: 15
                  required:
                  - step
                  - variant
                  - sent
                  - opened
                  - unique_opened
                  - replies
                  - unique_replies
                  - replies_automatic
                  - unique_replies_automatic
                  - clicks
                  - unique_clicks
