  /api/v2/custom-tags/toggle-resource:
    post:
      operationId: toggleTagResource
      summary: Assign or unassign tags to resources
      tags:
      - CustomTag
      description: This can be used for both accounts and campaigns. Please check the `resource_type` field for more information.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tag_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                    example: 019ffad2-9bdb-7827-9248-8c35500ac3c5
                  description: The list of tag ids to assign or unassign
                resource_type:
                  type: number
                  enum:
                  - 1
                  - 2
                  description: The resource type to assign or unassign the tags to
                  x-enumDescriptions:
                    '1': Account
                    '2': Campaign
                  example: 1
                resource_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    example: resource-1
                  description: The list of resource ids to assign or unassign. A resource id is the id of an account or a campaign. Required unless `selected_all` is `true`.
                excluded_resource_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    example: resource-1
                  description: Optional list of resource ids to exclude when `selected_all` is `true`.
                assign:
                  type: boolean
                  description: Whether to assign the tags to the resources.
                  example: true
                selected_all:
                  type: boolean
                  description: Whether to select all resources.
                  example: false
                filter:
                  oneOf:
                  - type:
                    - string
                    - 'null'
                    examples:
                    - ACC_FILTER_PAUSED
                    enum:
                    - ACC_FILTER_PAUSED
                    - ACC_FILTER_ERROR
                    - ACC_FILTER_NO_CTD
                    - ACC_FILTER_PW_ACCOUNTS
                    - ACC_FILTER_DFY
                    - ACC_FILTER_DFY_SETUP_PENDING
                    - ACC_FILTER_W_ACTIVE
                    - ACC_FILTER_W_PAUSED
                    - ACC_FILTER_W_ERROR
                    - null
                    x-enumDescriptions:
                      ACC_FILTER_PAUSED: Paused
                      ACC_FILTER_ERROR: Error
                      ACC_FILTER_NO_CTD: No CTD
                      ACC_FILTER_PW_ACCOUNTS: PW Accounts
                      ACC_FILTER_DFY: DFY
                      ACC_FILTER_DFY_SETUP_PENDING: DFY Setup Pending
                      ACC_FILTER_W_ACTIVE: W Active
                      ACC_FILTER_W_PAUSED: W Paused
                      ACC_FILTER_W_ERROR: W Error
                      'null': No filter
                    example: ACC_FILTER_PAUSED
                  - type: object
                    additionalProperties: false
                    properties:
                      tag_id:
                        oneOf:
                        - type: string
                          format: uuid
                          examples:
                          - 019ffad2-8faf-7bd3-a109-efd683507585
                          example: 019ffad2-8faf-7bd3-a109-efd683507585
                        - type: string
                          enum:
                          - no-tag
                          examples:
                          - no-tag
                          example: no-tag
                      tag_ids:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          format: uuid
                          examples:
                          - 019ffad2-8fb0-70ac-a1d9-fe8b077f12d3
                          example: 019ffad2-8fb0-70ac-a1d9-fe8b077f12d3
                      tag_ids_all:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          format: uuid
                          examples:
                          - 019ffad2-8fb0-70ac-a1d9-fe8cf36017ed
                          example: 019ffad2-8fb0-70ac-a1d9-fe8cf36017ed
                      filter:
                        type:
                        - string
                        - 'null'
                        examples:
                        - ACC_FILTER_PAUSED
                        enum:
                        - ACC_FILTER_PAUSED
                        - ACC_FILTER_ERROR
                        - ACC_FILTER_NO_CTD
                        - ACC_FILTER_PW_ACCOUNTS
                        - ACC_FILTER_DFY
                        - ACC_FILTER_DFY_SETUP_PENDING
                        - ACC_FILTER_W_ACTIVE
                        - ACC_FILTER_W_PAUSED
                        - ACC_FILTER_W_ERROR
                        - null
                        x-enumDescriptions:
                          ACC_FILTER_PAUSED: Paused
                          ACC_FILTER_ERROR: Error
                          ACC_FILTER_NO_CTD: No CTD
                          ACC_FILTER_PW_ACCOUNTS: PW Accounts
                          ACC_FILTER_DFY: DFY
                          ACC_FILTER_DFY_SETUP_PENDING: DFY Setup Pending
                          ACC_FILTER_W_ACTIVE: W Active
                          ACC_FILTER_W_PAUSED: W Paused
                          ACC_FILTER_W_ERROR: W Error
                          'null': No filter
                        example: ACC_FILTER_PAUSED
                      search:
                        type: string
                        examples:
                        - jon@doe.com
                        example: jon@doe.com
                  description: Optional selected-all filter. Accepts the existing account-status string shape and the merged object shape for account status, tag, any-tag, all-tags, and search criteria.
                search:
                  type: string
                  description: Optional selected-all search query. If omitted, `filter.search` is used when present.
                  example: jon@doe.com
              required:
              - tag_ids
              - resource_type
              - assign
        required: true
