components:
  schemas:
    CustomTag:
      title: Custom Tag
      description: A custom tag for organizing and categorizing accounts and campaigns. You can use them as filters in apis that list accounts and campaigns.
      x-tags:
      - Schemas
      - CustomTag
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the custom tag
          readOnly: true
          format: uuid
          example: 019ffad2-5c81-7249-9039-cc6326ab04d5
        timestamp_created:
          type: string
          description: Timestamp when the custom tag was created
          readOnly: true
          format: date-time
          example: '2026-08-13T11:11:58.081Z'
        timestamp_updated:
          type: string
          description: Timestamp when the custom tag was last updated
          readOnly: true
          format: date-time
          example: '2026-08-13T11:11:58.081Z'
        organization_id:
          type: string
          description: Organization ID that owns this custom tag
          readOnly: true
          format: uuid
          example: 019ffad2-5c81-7249-9039-cc64ecc57a50
        label:
          type: string
          description: Display label for the custom tag. Must be unique per workspace after trimming whitespace.
          minLength: 1
          pattern: .*\S.*
          example: Important
        description:
          type:
          - 'null'
          - string
          description: Detailed description of the custom tag purpose
          example: Used for marking important items
      required:
      - id
      - timestamp_created
      - timestamp_updated
      - organization_id
      - label
      additionalProperties: false
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
