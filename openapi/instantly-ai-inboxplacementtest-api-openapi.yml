                    examples:
                    - true
                    example: true
                  enable_slow_ramp:
                    type: boolean
                    examples:
                    - true
                    example: true
                  disable_slow_ramp:
                    type: boolean
                    examples:
                    - true
                    example: true
                  add_tags:
                    type: array
                    items:
