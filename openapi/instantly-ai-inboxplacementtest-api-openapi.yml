                  type:
                  - 'null'
                  - array
                  description: Optional automations to trigger based on conditions
                  minItems: 0
                  items:
                    type: object
                    properties:
                      when:
                        type: object
                        properties:
                          condition:
                            type: string
                            description: Condition for automation trigger
                            enum:
                            - placement_goes_below
                            - placement_goes_above
                            - added_to_blacklists
                            - removed_from_blacklists
