  /api/v2/campaigns/{id}/activate:
    post:
      operationId: activateCampaign
      summary: Activate(start), or resume a campaign
      tags:
      - Campaign
      description: 'Requires one of the following scopes: `campaigns:update`, `campaigns:all`, `all:update`, `all:all`'
      parameters:
