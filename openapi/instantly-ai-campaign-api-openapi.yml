components:
  schemas:
    Campaign:
      title: Campaign
      description: A campaign that can be sent to a list of recipients
      x-tags:
      - Schemas
      - Campaign
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the campaign
          readOnly: true
          format: uuid
          example: 019ffad2-5c4b-761a-9bc4-0599e8a95bea
        name:
          type: string
          description: Name of the campaign
          example: My First Campaign
        pl_value:
          type:
          - 'null'
          - number
          description: Value of every positive lead
          example: 100
        status:
          type: number
          description: Campaign Status
          readOnly: true
          enum:
          - -99
          - -1
          - -2
          - 0
          - 1
          - 2
          - 3
          - 4
          x-enumDescriptions:
            '0': Draft
            '1': Active
            '2': Paused
            '3': Completed
            '4': Running Subsequences
            '-99': Account Suspended
            '-1': Accounts Unhealthy
            '-2': Bounce Protect
          example: 1
        is_evergreen:
          type:
          - 'null'
          - boolean
          description: Whether the campaign is evergreen
          example: false
        campaign_schedule:
          type: object
          description: Campaign schedule
          properties:
            start_date:
              type:
              - 'null'
              - string
              format: date
              description: Start date in YYYY-MM-DD format. Uses the campaign's timezone.
              example: '2025-09-25'
            end_date:
              type:
              - 'null'
              - string
              format: date
              description: End date in YYYY-MM-DD format. Uses the campaign's timezone.
              example: '2025-09-25'
            schedules:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: My Schedule
                  timing:
                    type: object
                    properties:
                      from:
                        type: string
                        pattern: ^([01][0-9]|2[0-3]):([0-5][0-9])$
                        example: 09:00
                      to:
                        type: string
                        pattern: ^([01][0-9]|2[0-3]):([0-5][0-9])$
                        example: '17:00'
                    required:
                    - from
                    - to
                  days:
                    type: object
                    minProperties: 1
                    properties:
                      '0':
                        type: boolean
                        example: true
                      '1':
                        type: boolean
                        example: true
                      '2':
                        type: boolean
                        example: true
                      '3':
                        type: boolean
                        example: true
                      '4':
                        type: boolean
                        example: true
                      '5':
                        type: boolean
                        example: false
                      '6':
                        type: boolean
                        example: false
