description: >-
  Instantly's published plans, read from https://instantly.ai/pricing on 2026-08-13. Pricing is
  organised in three families that can be bought separately or as a bundle: Outreach (sending
  volume + contacts), Credits (lead database and enrichment), and Bundles (the two combined).
  Every price below is the list monthly price; the annual price shown on the same page is the
  discounted equivalent. This file replaces the scaffold defaults written on 2026-05-22 (a
  fictional "free tier, 1000 requests/month"), which did not correspond to anything Instantly
  publishes — Instantly has no free plan, and 170 of the 173 API operations document a 402 error
  meaning the workspace has no active paid plan.
api_access_note: >-
  API access is not sold as its own plan. It is a feature of the paid Outreach plans (the feature
  matrix lists "API, webhooks" under the plan comparison), and an unpaid workspace receives HTTP
  402 on essentially every endpoint. There is no free API tier and no published per-call pricing.
